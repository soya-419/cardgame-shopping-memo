<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>デュエマ値段メモ</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  body{font-family:sans-serif;margin:0;background:#f4f4f7;color:#222}
  header{background:#c0392b;color:#fff;padding:12px;font-size:18px;font-weight:bold}
  main{padding:12px;max-width:600px;margin:auto}
  input,button{font-size:16px;padding:8px;border-radius:8px;border:1px solid #ccc}
  button{background:#c0392b;color:#fff;border:none}
  button.sub{background:#888}
  .row{display:flex;gap:6px;margin:6px 0}
  .row input{flex:1;min-width:0}
  .card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}
  .card img{width:90px;border-radius:6px;float:right;margin-left:8px}
  .name{font-size:18px;font-weight:bold}
  .ver{display:inline-block;font-size:13px;font-weight:normal;color:#fff;background:#555;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .handle{display:inline-block;color:#999;font-size:22px;padding:0 10px 0 0;cursor:grab;touch-action:none;user-select:none}
  .ghost{opacity:.4}
  .shop{display:flex;justify-content:space-between;padding:4px 6px;border-radius:6px}
  .cheap{background:#ffe08a;font-weight:bold}
  .x{background:none;color:#c00;padding:0 6px}
  .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;clear:both}
</style>
</head>
<body>
<header>デュエマ値段メモ</header>
<main>
  <input id="search" placeholder="🔍 カード名・バージョンで検索" style="width:100%;box-sizing:border-box">
  <div class="row">
    <input id="newName" placeholder="新しいカード名">
    <input id="newVer" placeholder="バージョン(任意)" style="flex:0.7">
    <button onclick="addCard()">追加</button>
  </div>
  <div id="list"></div>
  <div class="tools">
    <button class="sub" onclick="exportData()">バックアップ書き出し</button>
    <button class="sub" onclick="document.getElementById('imp').click()">読み込み</button>
    <input type="file" id="imp" accept=".json" hidden onchange="importData(this)">
  </div>
</main>
<script>
const KEY = 'dmPriceMemo';
let cards = JSON.parse(localStorage.getItem(KEY) || '[]');
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(cards)); }
  catch(e){ alert('保存容量がいっぱいです。写真を減らしてください。'); }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = document.getElementById('list');

function render(){
  const q = document.getElementById('search').value.trim();
  list.innerHTML = '';
  cards.forEach((c, i) => {
    if (q && !(c.name + ' ' + (c.ver || '')).includes(q)) return;
    const min = c.prices.length ? Math.min(...c.prices.map(p => p.price)) : null;
    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.i = i;
    div.innerHTML = `
      ${c.photo ? `<img src="${esc(c.photo)}" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : ''}
      <div class="name"><span class="handle">☰</span>${esc(c.name)}${c.ver ? `<span class="ver">${esc(c.ver)}</span>` : ''}</div>
      ${c.prices.map((p, j) => `
        <div class="shop ${p.price === min ? 'cheap' : ''}">
          <span>${p.price === min ? '👑 ' : ''}${esc(p.shop)}</span>
          <span>¥${p.price.toLocaleString()} <button class="x" onclick="delPrice(${i},${j})">✕</button></span>
        </div>`).join('')}
      <div class="row">
        <input id="s${i}" placeholder="ショップ名">
        <input id="p${i}" type="number" inputmode="numeric" placeholder="値段">
        <button onclick="addPrice(${i})">＋</button>
      </div>
      <div class="tools">
        <button class="sub" onclick="document.getElementById('f${i}').click()">📷 写真</button>
        <input type="file" id="f${i}" accept="image/*" hidden onchange="setPhoto(${i}, this)">
        <button class="sub" onclick="setImageUrl(${i})">🔗 画像URL</button>
        <button class="sub" onclick="setVer(${i})">✏️ バージョン</button>
        <button class="sub" onclick="openOfficial(${i})">公式で検索</button>
        <button class="sub" onclick="delCard(${i})">削除</button>
      </div>`;
    list.appendChild(div);
  });
  if (window.sorter) sorter.option('disabled', !!q);
}

function addCard(){
  const el = document.getElementById('newName');
  const vel = document.getElementById('newVer');
  const name = el.value.trim();
  const ver = vel.value.trim();
  if (!name) return;
  cards.unshift({name, ver, prices: [], photo: null});
  el.value = ''; vel.value = ''; save(); render();
}
function setVer(i){
  const v = prompt('バージョン(例:通常版、シークレット、プロモ など)', cards[i].ver || '');
  if (v === null) return;
  cards[i].ver = v.trim(); save(); render();
}
function addPrice(i){
  const shop = document.getElementById('s'+i).value.trim();
  const price = parseInt(document.getElementById('p'+i).value);
  if (!shop || isNaN(price)) return;
  cards[i].prices.push({shop, price}); save(); render();
}
function delPrice(i, j){ cards[i].prices.splice(j, 1); save(); render(); }
function delCard(i){
  const label = cards[i].name + (cards[i].ver ? '(' + cards[i].ver + ')' : '');
  if (confirm(label + ' を削除しますか?')) { cards.splice(i, 1); save(); render(); }
}
function setPhoto(i, input){
  const file = input.files[0]; if (!file) return;
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 300 / img.width);
    const cv = document.createElement('canvas');
    cv.width = img.width * scale; cv.height = img.height * scale;
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    cards[i].photo = cv.toDataURL('image/jpeg', 0.7);
    save(); render();
  };
  img.src = URL.createObjectURL(file);
}
function setImageUrl(i){
  const url = prompt('公式サイトのカード画像を長押しして「画像アドレスをコピー」し、ここに貼り付けてください', '');
  if (url === null) return;
  const u = url.trim();
  if (u === '') { cards[i].photo = null; save(); render(); return; }
  if (!/^https:\/\//.test(u)) { alert('https:// で始まるURLを貼り付けてください'); return; }
  cards[i].photo = u; save(); render();
}
function openOfficial(i){
  const q = encodeURIComponent('site:dm.takaratomy.co.jp/card ' + cards[i].name);
  window.open('https://www.google.com/search?q=' + q, '_blank');
}
function exportData(){
  const blob = new Blob([JSON.stringify(cards)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dm-price-backup.json'; a.click();
}
function importData(input){
  const file = input.files[0]; if (!file) return;
  file.text().then(t => {
    try { cards = JSON.parse(t); save(); render(); alert('読み込みました'); }
    catch(e){ alert('ファイルが正しくありません'); }
  });
}

window.sorter = Sortable.create(list, {
  handle: '.handle',
  animation: 150,
  ghostClass: 'ghost',
  onEnd(){
    const order = [...list.children].map(el => +el.dataset.i);
    cards = order.map(k => cards[k]);
    save(); render();
  }
});
document.getElementById('search').addEventListener('input', render);
render();
</script>
</body>
</html>
